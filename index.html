<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> Mercado Pago </title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .container { max-width: 375px; margin: 0 auto; background: #00B0FF; min-height: 100vh; }
        .header { background: #0091EA; padding: 20px; color: white; }
        .balance { font-size: 32px; font-weight: bold; }
        .transfer-item { background: white; margin: 10px; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; }
        .editable { border: none; background: transparent; font-size: inherit; }
        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 10px 20px; border-radius: 20px; display: none; z-index: 1000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Hola, <input id="userName" class="editable" value="Usuario" /></h2>
            <div class="balance">$ <input id="userBalance" class="editable" value="25,000.00" /></div>
        </div>
        
        <div id="transferList">
            <div class="transfer-item">
                <span>Transferencia recibida</span>
                <span>$ <input class="editable transfer-amount" value="1,000.00" /></span>
            </div>
        </div>
        
        <button id="addTransfer">Agregar transferencia</button>
    </div>
    
    <div id="notification" class="notification"></div>
    
    <script src="app.js"></script>
</body>
</html>
